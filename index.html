<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taquería El Pariente - Práctica Math.atan2</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Space Mono', monospace;
            background-color: #FFFFFF;
            color: #000000;
        }
        .font-heading {
            font-family: 'Montserrat', sans-serif;
            font-weight: 900;
        }
        /* Marco rojo alrededor de la pantalla */
        .red-frame {
            border: 4px solid #D60000;
            outline: 2px solid #D60000;
            outline-offset: 4px;
        }
        .card-border {
            border: 3px solid #000000;
            box-shadow: 5px 5px 0px #000000;
        }
        .btn-action {
            border: 3px solid #000000;
            background-color: #D60000;
            color: #FFFFFF;
            box-shadow: 4px 4px 0px #000000;
            transition: all 0.1s ease;
        }
        .btn-action:hover {
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0px #000000;
        }
        .btn-action:active {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0px #000000;
        }
        .btn-secondary {
            border: 3px solid #000000;
            background-color: #FFFFFF;
            color: #000000;
            box-shadow: 4px 4px 0px #000000;
            transition: all 0.1s ease;
        }
        .btn-secondary:hover {
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0px #000000;
        }
        .btn-secondary:active {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0px #000000;
        }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8 flex flex-col justify-between selection:bg-red-600 selection:text-white">

    <!-- MARCO CONTENEDOR PRINCIPAL -->
    <div class="red-frame min-h-[calc(100vh-4rem)] p-4 md:p-8 flex flex-col justify-between relative bg-white">

        <!-- ENCABEZADO -->
        <header class="w-full text-center pb-4 border-b-2 border-black flex flex-col items-center justify-center">
            <h1 class="font-heading text-3xl md:text-5xl uppercase tracking-wider text-black">
                TAQUERIA EL PARIENTE
            </h1>
            <p class="text-xs md:text-sm text-red-600 font-bold uppercase tracking-widest mt-1">
                PRACTICA INTERACTIVA MATH.ATAN2
            </p>
        </header>

        <!-- PANTALLA 1: MENU DE INICIO -->
        <section id="menu-screen" class="flex-1 flex flex-col items-center justify-center my-8 text-center">
            <div class="card-border p-6 md:p-10 max-w-lg w-full bg-white">
                <div class="w-32 h-32 mx-auto mb-6 flex items-center justify-center border-2 border-black p-2">
                    <img src="cerdo-01.png" alt="Logo" class="max-w-full max-h-full object-contain">
                </div>

                <p class="text-sm md:text-base font-bold text-gray-800 mb-8 border-l-4 border-red-600 pl-4 text-left">
                    Diseño basado en el proyecto de Taquería El Pariente.
                </p>

                <button id="start-btn" class="btn-action w-full py-4 text-lg font-heading tracking-wider uppercase">
                    ENTRAR A LA ACTIVIDAD
                </button>
            </div>
        </section>

        <!-- PANTALLA 2: ACTIVIDAD CANVAS -->
        <section id="activity-screen" class="hidden flex-1 flex flex-col items-center justify-between my-4 w-full">
            <div class="w-full flex justify-start mb-4">
                <button id="back-btn" class="btn-secondary px-6 py-2 text-sm font-bold uppercase tracking-wider">
                    VOLVER AL MENU PRINCIPAL
                </button>
            </div>

            <!-- CONTENEDOR DEL CANVAS -->
            <div class="w-full flex-1 min-h-[400px] card-border bg-white relative overflow-hidden flex items-center justify-center">
                <canvas id="rotationCanvas" class="w-full h-full block cursor-crosshair"></canvas>
            </div>
        </section>

        <!-- PIE DE PAGINA -->
        <footer class="w-full pt-4 border-t-2 border-black flex flex-col md:flex-row justify-between items-center text-xs font-bold uppercase">
            <span class="text-black">TAQUERIA EL PARIENTE - PRACTICA WEB</span>
            <span class="text-red-600 font-heading text-sm mt-2 md:mt-0">ALGO BIEN, ALWAYS!</span>
        </footer>

    </div>

    <!-- LOGICA JAVASCRIPT -->
    <script>
        // Referencias al DOM
        const menuScreen = document.getElementById('menu-screen');
        const activityScreen = document.getElementById('activity-screen');
        const startBtn = document.getElementById('start-btn');
        const backBtn = document.getElementById('back-btn');
        const canvas = document.getElementById('rotationCanvas');
        const ctx = canvas.getContext('2d');

        // Carga de la imagen
        const characterImg = new Image();
        characterImg.src = 'cerdo-01.png';

        // Variables del Canvas
        let mouseX = 0;
        let mouseY = 0;
        let charX = 0;
        let charY = 0;
        let currentAngle = 0;
        let animationFrameId = null;

        // Ajustar tamaño del Canvas al contenedor
        function resizeCanvas() {
            const container = canvas.parentElement;
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
            
            // Posicionar el personaje en el centro
            charX = canvas.width / 2;
            charY = canvas.height / 2;
        }

        // Navegación de pantallas
        startBtn.addEventListener('click', () => {
            menuScreen.classList.add('hidden');
            activityScreen.classList.remove('hidden');
            resizeCanvas();
            mouseX = charX;
            mouseY = charY - 100;
            startAnimation();
        });

        backBtn.addEventListener('click', () => {
            activityScreen.classList.add('hidden');
            menuScreen.classList.remove('hidden');
            stopAnimation();
        });

        // Eventos del Mouse
        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            mouseX = e.clientX - rect.left;
            mouseY = e.clientY - rect.top;
        });

        window.addEventListener('resize', () => {
            if (!activityScreen.classList.contains('hidden')) {
                resizeCanvas();
            }
        });

        // Bucle de animación
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Cálculo del ángulo con Math.atan2
            const dx = mouseX - charX;
            const dy = mouseY - charY;
            currentAngle = Math.atan2(dy, dx);

            // Dibujar el personaje rotado
            ctx.save();
            ctx.translate(charX, charY);
            ctx.rotate(currentAngle);

            const imgWidth = 120;
            const imgHeight = 120;

            if (characterImg.complete && characterImg.naturalWidth !== 0) {
                ctx.drawImage(characterImg, -imgWidth / 2, -imgHeight / 2, imgWidth, imgHeight);
            } else {
                // Dibujo temporal si no ha cargado la imagen
                ctx.fillStyle = '#D60000';
                ctx.fillRect(-40, -40, 80, 80);
                ctx.fillStyle = '#000000';
                ctx.beginPath();
                ctx.arc(20, 0, 8, 0, Math.PI * 2);
                ctx.fill();
            }

            ctx.restore();

            animationFrameId = requestAnimationFrame(draw);
        }

        function startAnimation() {
            if (!animationFrameId) {
                draw();
            }
        }

        function stopAnimation() {
            if (animationFrameId) {
                cancelAnimationFrame(animationFrameId);
                animationFrameId = null;
            }
        }
    </script>
</body>
</html>
